# Local Postgres: `docker compose up -d db`. `nba` is the dev database; `nba_test` is the specs' (they reset it).
name: nba-games
services:
  db:
    image: postgres:17-alpine
    container_name: nba-db
    environment:
      POSTGRES_USER: nba
      POSTGRES_PASSWORD: nba
      POSTGRES_DB: nba
    ports:
      - '127.0.0.1:${DB_PORT:-5432}:5432'
    volumes:
      - nba-db:/var/lib/postgresql/data
      - ./scripts/db-init.sql:/docker-entrypoint-initdb.d/db-init.sql:ro

volumes:
  nba-db:
